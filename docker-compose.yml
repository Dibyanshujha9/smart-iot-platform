version: '3.9'
services:
  api:
    build: .
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/curvvtech
      - JWT_SECRET=${JWT_SECRET:-devsecret}
      - PORT=4000
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=100
    depends_on:
      - mongo
  mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data:
